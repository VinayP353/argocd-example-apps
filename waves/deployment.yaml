apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: waves-web
  name: waves-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waves-web
  strategy: {}
  template:
    metadata:
      labels:
        app: waves-web
    spec:
      containers:
      - image: gcr.io/google-samples/gb-frontend:v5
        name: gb-frontend
        ports:
        - containerPort: 80
        resources: {}
status: {}
